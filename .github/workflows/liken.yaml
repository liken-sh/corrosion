# The fork's own workflow. It builds the image at liken/Dockerfile,
# publishes it to ghcr.io/liken-sh/corrosion, and scans what it
# published with scan.yaml. Upstream's workflows stay in the tree
# untouched and are disabled in this repository's Actions settings, so
# this workflow and scan.yaml are the only workflows that run here.
#
# A pushed tag cuts a release: the tag names a version in liken's
# calendar scheme, 2026.09.09-001, and the image ships under that tag
# and :latest. A push to the liken branch cuts a development build:
# the version is the most recent release tag plus a suffix,
# 2026.09.09-001-dev-003-abcdef01, where 003 counts the commits since
# that release and abcdef01 is this commit. The suffix sorts after
# its release and before the next one, so a registry listing reads
# in order. A development build never moves :latest, so a cluster
# that pulls a release keeps pulling releases.
#
# There is no test gate here. The commits on the liken branch are
# upstream's, which upstream's CI tested, plus the fork's stack, and
# each commit in the stack has an upstream pull request that runs
# the same CI. liken/README.md explains the stack.
name: liken

on:
  push:
    branches: [liken]
    tags: ["**"]

# The workflow grants nothing by default. Each job below names the
# permissions it needs.
permissions: {}

# One release at a time. Two runs that pushed :latest at once would
# leave whichever finished second, which is not always the newer one.
concurrency:
  group: liken

# Each action is pinned by the commit of a release, and the comment
# names that release. A tag can move to another commit, and a commit
# cannot, so the pin is what the review of the commit that set it saw.
#
# cosign's image is pinned by digest, at the same version and digest
# as the pin in the liken repository's toolchains/images.toml. Follow
# that pin. cosign signs the pushed image. The syft scanner that
# writes the SBOM is pinned the same way in docker-bake.hcl.
env:
  COSIGN: ghcr.io/sigstore/cosign/cosign:v3.1.4@sha256:0f06154836d2de34f887a5c273506d52ca43edaa1d9e53e6510fa78a48f69c2d

jobs:
  release:
    runs-on: ubuntu-26.04
    # packages: write pushes the image and its signature. id-token:
    # write lets the job ask GitHub for the OIDC token that cosign
    # signs with, so only this job can sign as this workflow.
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # The checkout fetches the whole history, because git describe
      # below needs the tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The version comes from the event. A tag names it, and a tag of
      # any other shape stops the run before a build spends anything,
      # so no image ships under a name no cluster can order against
      # the others. Upstream's own tags, v0.1.0 and the like, arrived
      # with the fork and never push here, so they never reach this
      # check. A push to the liken branch derives the version: git
      # describe finds the most recent release tag and counts the
      # commits since it, and the first eight characters of the
      # commit sha make the build traceable.
      - name: Name the version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "$GITHUB_REF_NAME" | grep -Eq '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9]{3}$' || {
              echo "the tag '$GITHUB_REF_NAME' is not a release version; a release tag looks like 2026.09.09-001"
              exit 1
            }
            version=$GITHUB_REF_NAME
          else
            if described=$(git describe --tags --long --match '[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]-[0-9][0-9][0-9]' 2>/dev/null); then
              release=${described%-*-g*}
              count=${described#"$release"-}
              count=${count%-g*}
            else
              # Before the first release there is no tag to count from.
              # Serial 000 is liken's stand-in that never ships.
              release=0000.00.00-000
              count=$(git rev-list --count HEAD)
            fi
            version=$(printf '%s-dev-%03d-%s' "$release" "$count" "${GITHUB_SHA:0:8}")
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image's build is the `corrosion` target of docker-bake.hcl,
      # the same target that `make -C liken image` builds on a
      # workstation. It reads the :buildcache tag beside the image, so
      # a tag's release of a commit whose development build already ran
      # here rebuilds nothing. This build loads the image into Docker
      # for the proof below, and Docker's image store keeps no
      # attestations, so the push is a second build.
      - name: Build the image
        run: docker buildx bake --load corrosion

      # The runner has no peers, so nothing here replicates. What can
      # break invisibly is the dynamic closure, so the binary proves
      # that it loads its libraries by answering one flag.
      - name: Prove the image
        run: docker run --rm "ghcr.io/liken-sh/corrosion:$VERSION" --version

      # The push builds again on the same builder, so every layer comes
      # from the build above and nothing compiles. The bake file
      # attaches two attestations to the image: an SBOM, which the
      # pinned syft scanner writes from the crates that `cargo
      # auditable` recorded in the binary and from the base's
      # packages, and the build's provenance in max mode, which
      # records the Dockerfile, the context's commit, and the digest of
      # each base image. buildx stores both in the image's index, so
      # the index digest covers them.
      #
      # The bake file writes the OCI labels and annotations from the
      # four values below. SOURCE_DATE_EPOCH is the commit's time, which
      # BuildKit uses as the image config's creation time in place of
      # the wall clock, so the same commit builds the same config.
      # --metadata-file is where bake writes the digest of the pushed
      # index, which the next step signs.
      #
      # A release moves :latest. A development build pushes only its
      # own version, so :latest always names a release.
      - name: Push the image
        id: push
        run: |
          export SOURCE="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          export REVISION="$GITHUB_SHA"
          CREATED=$(git log -1 --format=%cI)
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export CREATED SOURCE_DATE_EPOCH
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            export LATEST=true
          fi
          docker buildx bake --push --metadata-file "$RUNNER_TEMP/metadata.json" corrosion
          echo "digest=$(jq -r '.corrosion["containerimage.digest"]' "$RUNNER_TEMP/metadata.json")" >> "$GITHUB_OUTPUT"

      # cosign signs keyless: it takes the job's OIDC token from the
      # two ACTIONS_ID_TOKEN_REQUEST variables, Fulcio certifies this
      # workflow as the signer, and Rekor records the signature. cosign
      # pushes the signature to the image's repository with the
      # credential that docker/login-action wrote to ~/.docker. The
      # container runs as the runner's user, so it can read that
      # configuration, and HOME is a writable directory for the
      # sigstore trust root that cosign fetches.
      #
      # The signature names the digest that the push wrote, not a tag,
      # because a tag can move. That digest names the index, so one
      # signature covers the image, the SBOM, and the provenance.
      - name: Sign the image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -e ACTIONS_ID_TOKEN_REQUEST_URL -e ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            -e DOCKER_CONFIG=/docker -v "$HOME/.docker:/docker:ro" \
            "$COSIGN" sign --yes "ghcr.io/liken-sh/corrosion@$DIGEST"
          echo "ghcr.io/liken-sh/corrosion:$VERSION@$DIGEST" >> "$GITHUB_STEP_SUMMARY"

  # Trivy scans the image that the job above pushed, by its version tag,
  # and uploads the findings to code scanning. scan.yaml holds the scan.
  # The release job holds the credentials that push and sign, so the
  # scan runs in its own jobs, and the release job cannot write
  # security events. These permissions are the most that the jobs of
  # scan.yaml can hold. Each of those jobs names a subset, and only its
  # trivy job, which uploads the findings, holds security-events: write.
  scan:
    needs: release
    permissions:
      actions: write
      contents: read
      packages: read
      security-events: write
    uses: ./.github/workflows/scan.yaml
    with:
      version: ${{ needs.release.outputs.version }}
