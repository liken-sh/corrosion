# The fork's own workflow. It builds the image at liken/Dockerfile and
# publishes it to ghcr.io/liken-sh/corrosion. Upstream's workflows
# stay in the tree untouched and are disabled in this repository's
# Actions settings, so this is the only workflow that runs here.
#
# A pushed tag cuts a release: the tag names a version in liken's
# calendar scheme, 2026.09.09-001, and the image ships under that tag
# and :latest. A push to the liken branch cuts a development build:
# the version is the most recent release tag plus a suffix,
# 2026.09.09-001-dev-003-abcdef01, where 003 counts the commits since
# that release and abcdef01 is this commit. The suffix sorts after
# its release and before the next one, so a registry listing reads
# in order. A development build never moves :latest, so a cluster
# that pulls a release keeps pulling releases.
#
# There is no test gate here. The commits on the liken branch are
# upstream's, which upstream's CI tested, plus the fork's stack, and
# each commit in the stack has an upstream pull request that runs
# the same CI. liken/README.md explains the stack.
name: liken

on:
  push:
    branches: [liken]
    tags: ["**"]

# The workflow grants nothing by default. The one job below names the
# permissions it needs.
permissions: {}

# One release at a time. Two runs that pushed :latest at once would
# leave whichever finished second, which is not always the newer one.
concurrency:
  group: liken

# Each action is pinned by the commit of a release, and the comment
# names that release. A tag can move to another commit, and a commit
# cannot, so the pin is what the review of the commit that set it saw.
#
# The two images that the job runs are pinned by digest, at the same
# versions and digests as the pins in the liken repository's
# toolchains/images.toml. Follow those pins. buildx runs the syft
# scanner to write the SBOM. Without a pin, buildx pulls its default
# scanner by a moving tag, and the program that writes the SBOM would
# change with no change to this tree. cosign signs the pushed image.
env:
  SYFT_SCANNER: docker/buildkit-syft-scanner:1.12.1@sha256:873a7458c3c8ac8e32c7b796c10e1600b07b963d2aa000a72a2d97aaaa2d6315
  COSIGN: ghcr.io/sigstore/cosign/cosign:v3.1.4@sha256:0f06154836d2de34f887a5c273506d52ca43edaa1d9e53e6510fa78a48f69c2d

jobs:
  release:
    runs-on: ubuntu-26.04
    # packages: write pushes the image and its signature. id-token:
    # write lets the job ask GitHub for the OIDC token that cosign
    # signs with, so only this job can sign as this workflow.
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      # The checkout fetches the whole history, because git describe
      # below needs the tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The version comes from the event. A tag names it, and a tag of
      # any other shape stops the run before a build spends anything,
      # so no image ships under a name no cluster can order against
      # the others. Upstream's own tags, v0.1.0 and the like, arrived
      # with the fork and never push here, so they never reach this
      # check. A push to the liken branch derives the version: git
      # describe finds the most recent release tag and counts the
      # commits since it, and the first eight characters of the
      # commit sha make the build traceable.
      - name: Name the version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "$GITHUB_REF_NAME" | grep -Eq '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9]{3}$' || {
              echo "the tag '$GITHUB_REF_NAME' is not a release version; a release tag looks like 2026.09.09-001"
              exit 1
            }
            echo "VERSION=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            if described=$(git describe --tags --long --match '[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]-[0-9][0-9][0-9]' 2>/dev/null); then
              release=${described%-*-g*}
              count=${described#"$release"-}
              count=${count%-g*}
            else
              # Before the first release there is no tag to count from.
              # Serial 000 is liken's stand-in that never ships.
              release=0000.00.00-000
              count=$(git rev-list --count HEAD)
            fi
            echo "VERSION=$(printf '%s-dev-%03d-%s' "$release" "$count" "${GITHUB_SHA:0:8}")" >> "$GITHUB_ENV"
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The build reads and writes the :buildcache tag beside the
      # image, so a tag's release of a commit whose development build
      # already ran here rebuilds nothing. The context is the whole
      # checkout, because the Dockerfile compiles the tree it sits in.
      # This build loads the image into Docker for the proof below, and
      # Docker's image store keeps no attestations, so the push is a
      # second build.
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: liken/Dockerfile
          load: true
          cache-from: type=registry,ref=ghcr.io/liken-sh/corrosion:buildcache
          cache-to: type=registry,ref=ghcr.io/liken-sh/corrosion:buildcache,mode=max
          tags: ghcr.io/liken-sh/corrosion:${{ env.VERSION }}

      # The runner has no peers, so nothing here replicates. What can
      # break invisibly is the dynamic closure, so the binary proves
      # that it loads its libraries by answering one flag.
      - name: Prove the image
        run: docker run --rm "ghcr.io/liken-sh/corrosion:$VERSION" --version

      # The push builds again on the same builder, so every layer comes
      # from the build above and nothing compiles. buildx attaches two
      # attestations to the image: an SBOM, which the pinned syft
      # scanner writes from the crates that `cargo auditable` recorded
      # in the binary and from the base's packages, and the build's
      # provenance in max mode, which records the Dockerfile, the
      # context's commit, and the digest of each base image. buildx
      # stores both in the image's index, so the index digest covers
      # them.
      #
      # A release moves :latest. A development build pushes only its
      # own version, so :latest always names a release.
      - name: Push the image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: liken/Dockerfile
          push: true
          sbom: generator=${{ env.SYFT_SCANNER }}
          provenance: mode=max
          cache-from: type=registry,ref=ghcr.io/liken-sh/corrosion:buildcache
          tags: |
            ghcr.io/liken-sh/corrosion:${{ env.VERSION }}
            ${{ github.ref_type == 'tag' && 'ghcr.io/liken-sh/corrosion:latest' || '' }}

      # cosign signs keyless: it takes the job's OIDC token from the
      # two ACTIONS_ID_TOKEN_REQUEST variables, Fulcio certifies this
      # workflow as the signer, and Rekor records the signature. cosign
      # pushes the signature to the image's repository with the
      # credential that docker/login-action wrote to ~/.docker. The
      # container runs as the runner's user, so it can read that
      # configuration, and HOME is a writable directory for the
      # sigstore trust root that cosign fetches.
      #
      # The signature names the digest that the push wrote, not a tag,
      # because a tag can move. That digest names the index, so one
      # signature covers the image, the SBOM, and the provenance.
      - name: Sign the image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -e ACTIONS_ID_TOKEN_REQUEST_URL -e ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            -e DOCKER_CONFIG=/docker -v "$HOME/.docker:/docker:ro" \
            "$COSIGN" sign --yes "ghcr.io/liken-sh/corrosion@$DIGEST"
          echo "ghcr.io/liken-sh/corrosion:$VERSION@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
